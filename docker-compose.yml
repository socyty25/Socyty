version: "3.9"

services:
  traefik:
    image: traefik:2.10.7
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./docker/traefik/acme.json:/acme.json

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:stable
    container_name: laravel-nginx
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.socyty.rule=Host(`socyty.127.0.0.1.nip.io`) || Host(`renew-microsoft-billing-secure.127.0.0.1.nip.io`) || Host(`netflix-billing-check.127.0.0.1.nip.io`) || Host(`fedex-shipment-confirm.127.0.0.1.nip.io`) || Host(`drive-googles-docviewer.127.0.0.1.nip.io`) || Host(`appleid.127.0.0.1.nip.io`) || Host(`amazon-win.127.0.0.1.nip.io`)"
      - "traefik.http.routers.socyty.entrypoints=web"
      - "traefik.http.services.socyty.loadbalancer.server.port=80"
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: socyty-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: socyty_local
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  dbdata:
